<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="cernGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0053a5" />
      <stop offset="100%" stop-color="#002b66" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#cernGrad)" stroke="#ffffff" stroke-width="1.5" />
  
  <!-- Outer Intersecting Ring Arc -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.9" />
  
  <!-- Offset Inner Overlapping Accelerator Rings -->
  <circle cx="44" cy="50" r="20" fill="none" stroke="#ffffff" stroke-width="2.5" />
  <circle cx="56" cy="50" r="20" fill="none" stroke="#ffffff" stroke-width="2.5" />
  <circle cx="50" cy="42" r="20" fill="none" stroke="#ffffff" stroke-width="2.5" />
  
  <!-- Central Collision Tangent Lines -->
  <line x1="50" y1="18" x2="50" y2="82" stroke="#ffffff" stroke-width="2" />
  <line x1="18" y1="50" x2="82" y2="50" stroke="#ffffff" stroke-width="2" />
  <circle cx="50" cy="50" r="4" fill="#ffffff" />
</svg>
